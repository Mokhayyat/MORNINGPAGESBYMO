<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Morning Pages overlays</title>
  <link rel="stylesheet" href="style.css">
  <script src="../node_modules/gsap/dist/gsap.min.js"></script>
  <script src="../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
</head>
<body>
  <svg id="defs" aria-hidden="true">
    <defs>
      <filter id="boil0" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="3" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="boil1" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="boil2" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="2" seed="13" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="14"/>
      </filter>
    </defs>
  </svg>
  <div id="stage"></div>
  <script type="module" src="main.js"></script>
</body>
</html>
